aid: manex-ai
name: Manex AI
description: >-
  Manex AI (Manex AI GmbH) is a European enterprise AI company that builds
  Kosmos, an Autonomous Enterprise AI Platform for industrial and manufacturing
  OEMs and their suppliers. Kosmos models the domains a business runs on and
  lets AI agents, workflows, and applications act on full enterprise context
  instead of fragments. On top of Kosmos, Manex ships purpose-built autonomous
  suites: Blackbelt (computer-aided quality / CAQ), Takt (manufacturing
  execution / MES), and Gemba (shopfloor operations), plus Horizon, a
  distribution platform that makes a solution built at one site instantly
  available to every other. Manex serves aerospace, automotive, chemistry,
  electronics, semiconductors, pharma and biotech, heavy equipment, industrial
  machinery, and home-appliance manufacturers. Made in Europe and built for the
  strictest compliance standards, the platform runs in cloud, on-premise, or
  hybrid environments with customer-controlled data residency, GDPR options,
  ISO 27001 and TISAX certification, enterprise access control, and full audit
  history. Manex AI is a portfolio company of Lightspeed Venture Partners.
